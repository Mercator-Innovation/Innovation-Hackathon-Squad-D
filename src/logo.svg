<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Hacky McHackface: a grinning house in a hard hat, checking a mould spot with a magnifying glass</title>
  <!-- Squad logo, made up for the hackathon. Not a real organisation's brand. -->
  <circle cx="150" cy="150" r="144" fill="#e7f1fb" stroke="#1d1d1b" stroke-width="8"/>

  <text x="150" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="#1d1d1b">Hacky</text>

  <g transform="translate(150 150) scale(0.72) translate(-164 -151)">
  <!-- house -->
  <rect x="97" y="150" width="106" height="78" fill="#fdd08a" stroke="#1d1d1b" stroke-width="5"/>
  <polygon points="80,156 150,106 220,156" fill="#c0392b" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round"/>
  <!-- hard hat -->
  <path d="M120 104 Q150 74 180 104 Z" fill="#ffdd00" stroke="#1d1d1b" stroke-width="5"/>
  <rect x="110" y="100" width="80" height="10" rx="5" fill="#ffdd00" stroke="#1d1d1b" stroke-width="5"/>
  <!-- googly eyes -->
  <circle cx="130" cy="180" r="14" fill="#fff" stroke="#1d1d1b" stroke-width="4"/>
  <circle cx="135" cy="184" r="6" fill="#1d1d1b"/>
  <circle cx="170" cy="180" r="14" fill="#fff" stroke="#1d1d1b" stroke-width="4"/>
  <circle cx="164" cy="176" r="6" fill="#1d1d1b"/>
  <!-- grin -->
  <path d="M126 205 Q150 225 174 205" fill="none" stroke="#1d1d1b" stroke-width="5" stroke-linecap="round"/>
  <!-- mould spot and magnifying glass -->
  <circle cx="196" cy="218" r="5" fill="#2f6b3c"/>
  <circle cx="203" cy="212" r="3.5" fill="#2f6b3c"/>
  <circle cx="222" cy="200" r="16" fill="#fff" fill-opacity="0.55" stroke="#1d1d1b" stroke-width="5"/>
  <line x1="233" y1="212" x2="248" y2="228" stroke="#1d1d1b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="150" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="37" font-weight="800" fill="#1d1d1b" textLength="192" lengthAdjust="spacingAndGlyphs">McHackface</text>
</svg>
